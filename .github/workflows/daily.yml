
name: Miniature ASMR Video

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Generate video
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
        run: |
          python generate_video.py "Ultra-realistic cinematic macro ASMR video of six tiny miniature construction workers building a beautiful wooden cabin from scratch on a real wooden workbench. The tiny workers wear yellow safety helmets and realistic work clothes. They measure wooden planks, saw the wood, hammer tiny nails and build the cabin step by step. Detailed wood grain, miniature tools, realistic movements, macro camera, warm cinematic lighting, shallow depth of field. Natural ASMR sounds of sawing, hammering, footsteps and scraping wood. No dialogue, no music, no subtitles, no cartoon style. Photorealistic." --duration 5

      - name: Upload generated video
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: miniature-cabin-asmr
          path: outputs/*.mp4
          if-no-files-found: error
          retention-days: 3
          
